  <text x="20" y="140" fill="#111" font-family="Georgia, serif" font-size="26" font-weight="bold">Scientists Discover New</text>
  <text x="20" y="175" fill="#111" font-family="Georgia, serif" font-size="26" font-weight="bold">Method for Clean Energy</text>
  <rect x="20" y="200" width="350" height="200" rx="4" fill="#d4d4d4"/>
  <text x="20" y="430" fill="#333" font-family="Georgia, serif" font-size="16" line-height="1.6">Researchers at a leading university have unveiled a breakthrough in renewable energy storage that could transform how power grids operate worldwide.</text>
  <text x="20" y="490" fill="#333" font-family="Georgia, serif" font-size="16">The new technique uses advanced materials to store energy more efficiently than current lithium-ion batteries, with significantly lower environmental impact.</text>
  <text x="20" y="560" fill="#333" font-family="Georgia, serif" font-size="16">Industry experts say commercial applications could arrive within the next decade, pending further testing and regulatory approval.</text>
